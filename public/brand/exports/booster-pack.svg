    <path fill="#00FFAB" d="M94.86,93.55l-11.05,21.94.05-17.3,10.76-21.14v15.84c0,.31.12.53.24.66Z"/>
    <path fill="#00FFAB" d="M51.37,98.67l.05,17.3-11.06-21.98c.09-.12.23-.33.23-.62l.02-15.86,10.76,21.15Z"/>
  </g>

