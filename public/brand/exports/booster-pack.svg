<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 500 700" fill="none" role="img" aria-label="Orange Cards Booster Pack Season 8">
  <defs>
    <radialGradient id="packBody" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0d3626"/>
      <stop offset="45%" stop-color="#082419"/>
      <stop offset="85%" stop-color="#04140e"/>
      <stop offset="100%" stop-color="#020a07"/>
    </radialGradient>

    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="48%" stop-color="#00ffab" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="crimpPattern" width="4" height="14" patternUnits="userSpaceOnUse">
      <rect width="4" height="14" fill="#03120c"/>
      <rect x="2" width="1" height="14" fill="#0d3b2a"/>
      <rect x="3" width="1" height="14" fill="#051c13"/>
    </pattern>

    <filter id="packShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="mintGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="packClip">
      <rect x="1" y="1" width="498" height="698" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <g filter="url(#packShadow)" clip-path="url(#packClip)">
  <!-- Body -->
  <rect x="0" y="0" width="500" height="700" fill="url(#packBody)"/>
  <rect x="0.5" y="0.5" width="499" height="699" rx="8" stroke="#00ffab" stroke-opacity="0.25"/>
  <rect x="0" y="0" width="500" height="700" fill="url(#packBody)" opacity="0"/>
  <rect x="0" y="0" width="500" height="700" fill="none" stroke="#00ffab" stroke-opacity="0.25" rx="8"/>
  <rect x="1" y="1" width="498" height="698" fill="url(#packBody)" stroke="#00ffab" stroke-opacity="0.25" rx="8"/>

  <!-- Inner glow -->
  <rect x="8" y="8" width="484" height="684" rx="6" fill="#00ffab" fill-opacity="0.03"/>
  <rect x="8" y="8" width="484" height="2" rx="1" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Top crimp -->
  <rect x="0" y="0" width="500" height="14" fill="url(#crimpPattern)"/>
  <rect x="0" y="13" width="500" height="1" fill="#00ffab" fill-opacity="0.2"/>
  <rect x="0" y="0" width="500" height="14" fill="#000000" fill-opacity="0.35"/>

  <!-- Background geometry -->
  <g opacity="0.25" stroke="#00ffab">
    <line x1="0" y1="125" x2="500" y2="475" stroke-width="0.75"/>
    <line x1="0" y1="225" x2="500" y2="575" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="500" y2="400" stroke-width="0.5"/>
    <circle cx="250" cy="350" r="175" stroke-width="0.5" stroke-dasharray="4 4" fill="none"/>
  </g>

  <!-- Foil sheen -->
  <rect x="0" y="14" width="500" height="672" fill="url(#foilSheen)"/>

  <!-- Icon -->
  <g transform="translate(218, 78) scale(0.52)">
    <path fill="#F4F7F5" d="M40.6,77.51l-.02,15.86c0,.29-.14.5-.23.62L1.04,15.26c-1.63-3.27-1.31-7.04.7-10.26C3.26,2.55,6.24.12,9.74.11l30.83-.07.04,77.47Z"/>
