  <!-- Season 8 -->
  <text x="250" y="310" text-anchor="middle" fill="#00ffab" fill-opacity="0.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="3.2">SEASON <tspan fill="#ffffff" font-weight="700">8</tspan></text>

  <!-- Card number -->
  <text x="250" y="410" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" filter="url(#mintGlow)">#01</text>

  <!-- Drop badge -->
  <g transform="translate(178, 440)">
    <rect x="0" y="0" width="144" height="26" rx="13" fill="#00ffab"/>
    <path d="M18 13 L20.5 17.5 L25.5 18.5 L22 22 L22.8 27 L18 24.5 L13.2 27 L14 22 L10.5 18.5 L15.5 17.5 Z" fill="#04140e" transform="translate(0,-1) scale(0.55)"/>
    <text x="72" y="17" text-anchor="middle" fill="#04140e" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">DROP AO VIVO</text>
  </g>

  <!-- Footer -->
  <line x1="188" y1="620" x2="212" y2="620" stroke="#00ffab" stroke-opacity="0.4" stroke-width="2"/>
  <text x="250" y="625" text-anchor="middle" fill="#00ffab" fill-opacity="0.85" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="2.8">BOOSTER PACK</text>
  <line x1="288" y1="620" x2="312" y2="620" stroke="#00ffab" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Bottom crimp -->
  <rect x="0" y="686" width="500" height="14" fill="url(#crimpPattern)"/>
  <rect x="0" y="686" width="500" height="1" fill="#00ffab" fill-opacity="0.2"/>
  <rect x="0" y="686" width="500" height="14" fill="#000000" fill-opacity="0.35"/>
  </g>
</svg>
